# Второй инстанс OBED — Robinhood Chain (Arbitrum Orbit L2, газ в ETH).
# Свой кошелёк, свой state, свой секрет: с BSC-инстансом не делит ничего.
# Ключ — только в GitHub Actions secret BOT_PRIVATE_KEY_ROBINHOOD.
#
# Включение (enabled: true) — только после того, как `python -m src.verify`
# в Actions прошёл зелёным на заполненном пуле. Пока enabled: false, тик
# не трогает сеть и не требует ключа.

name: robinhood
enabled: false

secrets:
  private_key_env: BOT_PRIVATE_KEY_ROBINHOOD

network:
  chain_id: 4663
  rpc_url: "https://rpc.mainnet.chain.robinhood.com"
  rpc_fallback_urls: []

contracts:
  # Uniswap V3 на Robinhood Chain — из официального SDK Uniswap
  # (sdks/sdk-core/src/addresses.ts, ROBINHOOD_ADDRESSES). Сверяются между
  # собой на цепи в src/verify.py: NPM.factory() и SwapRouter02.factory()
  # обязаны совпасть с factory.
  factory: "0x1f7d7550b1b028f7571e69a784071f0205fd2efa"
  position_manager: "0x73991a25c818bf1f1128deaab1492d45638de0d3"
  swap_router02: "0xcaf681a66d020601342297493863e78c959e5cb2"
  # WETH в SDK для этой сети не указан. Значение — NPM.WETH9() и
  # SwapRouter02.WETH9() с цепи (совпали, verify 04.10.2026).
  wrapped_native: "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"

pool:
  # Пара не выбрана. Заполнить из адреса пула; token0/token1 — в порядке,
  # который возвращает сам пул (verify проверит).
  address: ""
  token0: ""
  token1: ""
  fee_tier: null

position:
  range_width_pct: 10
  check_interval_hours: 3
  slippage_bps: 100
  min_gas_native: 0.0003    # ETH; на L2 полный цикл стоит много меньше

fees:
  payout_token_address: ""
  threshold_payout_token: null
  # Адрес "на обед" в ЭТОЙ сети. Не копировать BSC-адрес вслепую: если это
  # биржевой депозит, в Robinhood Chain он может не существовать.
  withdrawal_address: ""

stats:
  unit_label: "token1"

paths:
  state_file: "state/robinhood/state.json"
  log_file: "state/robinhood/actions.jsonl"
